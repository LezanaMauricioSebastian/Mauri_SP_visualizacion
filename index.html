<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Interactivo - Chaco</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://tile.openstreetmap.org">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <!-- Leaflet MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <div class="header-content">
      <div class="logo">
        <i class="fas fa-map-marked-alt"></i>
        <h1>Mapa Interactivo del Chaco</h1>
      </div>
      <div class="city-selector">
        <button type="button" class="city-option active" data-city="sp">
          <i class="fas fa-city"></i> Presidencia Roque S. Peña
        </button>
        <button type="button" class="city-option" data-city="gr">
          <i class="fas fa-building"></i> Gran Resistencia
        </button>
        <button type="button" class="city-option" data-city="va">
          <i class="fas fa-tree"></i> Villa Ángela
        </button>
      </div>
    </div>
  </header>

  <div class="map-container">
    <div class="loading" id="loading">
      <i class="fas fa-spinner spinner"></i>
      Cargando mapa...
    </div>
    <div id="map"></div>
    <div class="controls-panel" id="controls-panel">
      <div class="controls-header">
        <i class="fas fa-layer-group"></i>
        <h3>Capas del Mapa</h3>
      </div>
      <div id="layer-controls"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
  <!-- Módulos de la aplicación -->
  <script src="js/config.js?v=9"></script>
  <script src="js/map.js?v=7"></script>
  <script src="js/layers.js?v=5"></script>
  <script src="js/ui.js?v=3"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
