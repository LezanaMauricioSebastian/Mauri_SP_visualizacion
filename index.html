<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Interactivo - Chaco</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://tile.openstreetmap.org">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <!-- Leaflet MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="css/styles.css?v=5">
</head>
<body class="auth-locked">
  <header class="header">
    <div class="header-content">
      <div class="logo">
        <i class="fas fa-map-marked-alt"></i>
        <h1>Mapa Interactivo del Chaco</h1>
      </div>
      <div class="header-actions">
        <div class="city-selector" id="city-selector">
          <button type="button" class="city-option active" data-city="sp">
            <i class="fas fa-city"></i> Presidencia Roque S. Peña
          </button>
          <button type="button" class="city-option" data-city="gr">
            <i class="fas fa-building"></i> Gran Resistencia
          </button>
          <button type="button" class="city-option" data-city="va">
            <i class="fas fa-tree"></i> Villa Ángela
          </button>
        </div>
        <div id="clerk-user-button" class="clerk-user-button" hidden></div>
      </div>
    </div>
  </header>

  <div id="auth-gate" class="auth-gate">
    <div class="auth-card">
      <div class="auth-brand">
        <i class="fas fa-map-marked-alt" aria-hidden="true"></i>
        <h2>Mapa Interactivo del Chaco</h2>
        <p>Iniciá sesión para continuar</p>
      </div>
      <p id="auth-gate-error" class="auth-gate-error" hidden></p>
      <div id="auth-loading" class="auth-loading">
        <i class="fas fa-spinner spinner" aria-hidden="true"></i>
        Cargando acceso...
      </div>
      <div id="clerk-sign-in" hidden></div>
    </div>
  </div>

  <div class="map-container" id="map-container">
    <div class="loading" id="loading">
      <i class="fas fa-spinner spinner"></i>
      Cargando mapa...
    </div>
    <div id="map"></div>
    <div class="controls-panel" id="controls-panel">
      <button type="button" class="controls-header" id="controls-collapse-btn" aria-expanded="true" aria-controls="panel-body" title="Contraer">
        <i id="controls-header-icon" class="fas fa-question-circle" aria-hidden="true"></i>
        <h3 id="controls-title">Preguntas</h3>
        <i class="fas fa-chevron-up panel-chevron" aria-hidden="true"></i>
      </button>
      <div id="panel-body">
        <div class="panel-tabs" role="tablist">
          <button type="button" class="panel-tab active" data-tab="questions" role="tab" aria-selected="true">Preguntas</button>
          <button type="button" class="panel-tab" data-tab="layers" role="tab" aria-selected="false">Capas</button>
        </div>
        <div id="questions-panel">
          <div id="questions-list"></div>
        </div>
        <div id="layer-controls" hidden></div>
      </div>
    </div>
    <div class="ranking-panel" id="ranking-panel" hidden>
      <button type="button" class="ranking-header" id="ranking-collapse-btn" aria-expanded="true" aria-controls="ranking-list" title="Contraer">
        <i class="fas fa-list-ol" aria-hidden="true"></i>
        <h4 id="ranking-title">Ranking</h4>
        <i class="fas fa-chevron-up ranking-chevron" aria-hidden="true"></i>
      </button>
      <div id="ranking-list"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
  <!-- Módulos de la aplicación -->
  <script src="js/clerk-config.js?v=1"></script>
  <script src="js/auth.js?v=3"></script>
  <script src="js/config.js?v=10"></script>
  <script src="js/map.js?v=8"></script>
  <script src="js/spatial.js?v=1"></script>
  <script src="js/analysis.js?v=1"></script>
  <script src="js/legends.js?v=3"></script>
  <script src="js/layers.js?v=7"></script>
  <script src="js/ui.js?v=5"></script>
  <script src="js/questions.js?v=3"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
